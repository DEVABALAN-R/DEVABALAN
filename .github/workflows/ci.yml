name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  legacy-web:
    # The current Vite app stays deployable until cutover (plan §21).
    name: Legacy web app (Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  command-center:
    name: Command Center (Expo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/command-center
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/command-center/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npx eslint . --max-warnings 0
      - name: Format
        run: npm run format:check
      - name: Unit and component tests
        run: npm run test:ci
      - name: Web build
        run: npm run build:web
      - name: Web bundle size
        run: npm run check:bundle
      - name: Expo doctor
        # Two checks need Expo's online services and could not be verified in the
        # authoring environment; make this blocking once it is confirmed green here.
        continue-on-error: true
        run: npx expo-doctor
