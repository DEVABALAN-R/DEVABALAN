name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  legacy-web:
    # The current Vite app stays deployable until cutover (plan §21).
    name: Legacy web app (Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  database:
    # Applies every migration to a fresh Postgres, runs the SQL tests (RLS, grants,
    # sign-up hook, audit log), then rolls the latest migration back and re-applies it.
    name: Database migrations (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Migration and RLS tests
        run: bash supabase/tests/run.sh

  command-center:
    name: Command Center (Expo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/command-center
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/command-center/package-lock.json
      - run: npm ci
      - name: No secret-looking public variables
        # EXPO_PUBLIC_* values are embedded in the app bundle; secrets must never use that prefix.
        run: |
          if grep -rEn 'EXPO_PUBLIC_[A-Z0-9_]*(SECRET|SERVICE|PRIVATE)' --include='*.ts' --include='*.tsx' --include='*.js' --include='*.json' --include='.env*' --exclude-dir=node_modules --exclude-dir=dist .; then
            echo "A public (EXPO_PUBLIC_) variable name looks like a secret." >&2
            exit 1
          fi
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npx eslint . --max-warnings 0
      - name: Format
        run: npm run format:check
      - name: Unit and component tests
        run: npm run test:ci
      - name: Web build
        run: npm run build:web
      - name: Web bundle size
        run: npm run check:bundle
      - name: Expo doctor
        # Two checks need Expo's online services and could not be verified in the
        # authoring environment; make this blocking once it is confirmed green here.
        continue-on-error: true
        run: npx expo-doctor
